app = "scrapbook-core"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[mounts]
  source = "data"
  destination = "/usr/src/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared-cpu-1x"
  memory_mb = 1024

[scheduled_jobs]
  [[scheduled_jobs.jobs]]
    name = "run-scraper"
    schedule = "@daily"
    command = "node scripts/index.mjs --all"

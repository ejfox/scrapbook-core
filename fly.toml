app = "scrapbook-core"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DEBUG = "false"
  INSTANCE_NAME = "fly-{{.Region}}-scrapbook-{{.ID}}"

[mounts]
  source = "data"
  destination = "/usr/src/app/data"

[processes]
  app = "node scripts/index.mjs --all"

[[vm]]
  memory = "2048"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9091
  path = "/metrics"

# Keep scheduled jobs separate from processes
[scheduled_jobs]
  [[scheduled_jobs.jobs]]
    name = "run-scraper"
    schedule = "@daily"
    command = "node scripts/index.mjs --all"
    timeout = "30m"
    environment = { DEBUG = "true" }

  [[scheduled_jobs.jobs]]
    name = "cleanup-stuck"
    schedule = "@hourly"
    command = "node scripts/validate_db_integrity.mjs"
    timeout = "5m"
    environment = { DEBUG = "true" }

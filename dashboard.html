<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://unpkg.com/observable-plot@0.6.11/dist/plot.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #00ff88;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #aaa;
            font-size: 0.9rem;
        }
        .search-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }
        .search-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1.1rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .result-card:hover {
            border-color: #00ff88;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
            transform: translateY(-5px);
        }
        .result-title {
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .result-summary {
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .result-meta {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.9rem;
        }
        .source-tag {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            color: #00ff88;
            font-size: 1.2rem;
            margin: 40px 0;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }
        .chart-title {
            color: #00ff88;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Scrapbook Dashboard</h1>
            <p style="color: #888;">Your digital memory, visualized</p>
        </div>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalScraps">-</div>
                <div class="stat-label">Total Scraps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayScraps">-</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="weekScraps">-</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sources">-</div>
                <div class="stat-label">Sources</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Activity Over Time</div>
            <div id="timeChart"></div>
        </div>

        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                placeholder="Search your digital memory..."
                id="searchInput"
                autocomplete="off"
            >
        </div>

        <div class="results-container" id="results"></div>
    </div>

    <script>
        let allScraps = [];
        let searchTimeout;

        async function loadData() {
            try {
                // In a real implementation, this would connect to your database
                // For now, we'll simulate some data
                const response = await fetch('/api/scraps');
                allScraps = await response.json();
            } catch (error) {
                // Fallback to sample data for demo
                allScraps = generateSampleData();
            }
            
            updateStats();
            createTimeChart();
        }

        function generateSampleData() {
            const sources = ['pinboard', 'github', 'mastodon', 'arena'];
            const data = [];
            
            for (let i = 0; i < 500; i++) {
                const date = new Date();
                date.setDate(date.getDate() - Math.floor(Math.random() * 365));
                
                data.push({
                    id: `scrap-${i}`,
                    title: `Sample scrap ${i}`,
                    summary: `This is a sample summary for scrap ${i}. It contains interesting information about digital ephemera.`,
                    source: sources[Math.floor(Math.random() * sources.length)],
                    created_at: date.toISOString(),
                    url: `https://example.com/item/${i}`,
                    tags: ['sample', 'demo', 'data']
                });
            }
            
            return data;
        }

        function updateStats() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            const todayScraps = allScraps.filter(s => new Date(s.created_at) >= today).length;
            const weekScraps = allScraps.filter(s => new Date(s.created_at) >= weekAgo).length;
            const sources = [...new Set(allScraps.map(s => s.source))].length;

            document.getElementById('totalScraps').textContent = allScraps.length.toLocaleString();
            document.getElementById('todayScraps').textContent = todayScraps;
            document.getElementById('weekScraps').textContent = weekScraps;
            document.getElementById('sources').textContent = sources;
        }

        function createTimeChart() {
            const daily = d3.rollup(
                allScraps,
                v => v.length,
                d => d3.timeDay.floor(new Date(d.created_at))
            );

            const data = Array.from(daily, ([date, count]) => ({ date, count }))
                .sort((a, b) => a.date - b.date);

            const chart = Plot.plot({
                title: "Daily Activity",
                width: document.getElementById('timeChart').offsetWidth,
                height: 200,
                color: { scheme: "viridis" },
                marks: [
                    Plot.rectY(data, {
                        x: "date",
                        y: "count",
                        fill: "#00ff88",
                        opacity: 0.7
                    }),
                    Plot.ruleY([0])
                ]
            });

            document.getElementById('timeChart').appendChild(chart);
        }

        function search(query) {
            if (!query.trim()) {
                document.getElementById('results').innerHTML = '';
                return;
            }

            const results = allScraps
                .filter(scrap => 
                    scrap.title.toLowerCase().includes(query.toLowerCase()) ||
                    scrap.summary.toLowerCase().includes(query.toLowerCase()) ||
                    scrap.tags.some(tag => tag.toLowerCase().includes(query.toLowerCase()))
                )
                .slice(0, 20);

            displayResults(results);
        }

        function displayResults(results) {
            const container = document.getElementById('results');
            
            if (results.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; margin: 40px 0;">No results found</div>';
                return;
            }

            container.innerHTML = results.map(scrap => `
                <div class="result-card" onclick="window.open('${scrap.url}', '_blank')">
                    <div class="result-title">${scrap.title}</div>
                    <div class="result-summary">${scrap.summary || 'No summary available'}</div>
                    <div class="result-meta">
                        <span class="source-tag">${scrap.source}</span>
                        <span>${new Date(scrap.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        // Setup search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => search(e.target.value), 300);
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>

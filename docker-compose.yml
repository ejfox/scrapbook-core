version: '3.8'

services:
  scrapbook:
    build: .
    container_name: scrapbook-core
    environment:
      - NODE_ENV=production
      # API Keys - override these with .env file
      - GITHUB_TOKEN
      - GITHUB_USERNAME
      - PINBOARD_TOKEN
      - ARENA_ACCESS_TOKEN
      - USER_SLUG
      - MASTODON_ACCESS_TOKEN
      - MASTODON_API_URL
      - SUPABASE_URL
      - SUPABASE_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - OPENROUTER_API_KEY
      - OPENCAGE_API_KEY
    volumes:
      # Persist SQLite database and cache
      - ./data:/usr/src/app/data
      # Persist logs
      - ./logs:/usr/src/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/usr/src/app/logs/app.log') ? 0 : 1)"]
      interval: 1m
      timeout: 10s
      retries: 3
    # Start both cron and the main application
    command: sh -c "cron && node scripts/index.mjs --all" 
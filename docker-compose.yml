version: '3.8'

services:
  scrapbook-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrapbook-core:latest
    container_name: scrapbook-core
    restart: unless-stopped
    
    environment:
      - NODE_ENV=production
      - CONTAINER_NAME=scrapbook-core
      - INSTANCE_NAME=docker-scrapbook-prod
      
    env_file:
      - .env
    
    volumes:
      # Persist data directory
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
      # Optional: mount custom .env file
      - ./.env:/app/.env:ro
    
    # ports:
      # Optional: expose API server port if needed
      # - "3001:3000"
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Health check — validates env vars and node process is alive
    healthcheck:
      test: ["CMD", "node", "lib/validateEnvironment.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API server / dashboard with full health endpoint
  scrapbook-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrapbook-core:latest
    container_name: scrapbook-api
    restart: unless-stopped
    command: ["node", "scripts/api-server.mjs"]

    environment:
      - NODE_ENV=production

    env_file:
      - .env

    volumes:
      - ./.env:/app/.env:ro

    ports:
      - "3001:3001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: scrapbook-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

volumes:
  # Uncomment if using Redis
  redis-data:
  
networks:
  default:
    name: scrapbook-network